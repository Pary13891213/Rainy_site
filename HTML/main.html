<!-- ../HTML/main.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USER INTERFACE</title>
    <link rel="stylesheet" href="/CSS/main.css">
</head>
<body>
    <div class="main-page">
        <!-- منوی بالای صفحه -->
        <div class="top-menu">
            <div class="menu-title">USER TERMINAL [v1.0]</div>

            <button class="hamburger-menu" aria-label="Toggle menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <div class="menu-links">
                <a href="#" class="menu-link active" data-tab="chat">CHAT</a>
                <a href="#" class="menu-link" data-tab="hack">HACK</a>
                <a href="#" class="menu-link" data-tab="notes">NOTES</a>
                <a href="#" class="menu-link" data-tab="setting">SETTING</a>
                <a href="#" class="menu-link" data-tab="game">GAME</a>
            </div>
            <div class="user-status">
                <span class="status-indicator online"></span>
                <span id="connection-status">CONNECTED</span>
            </div>
        </div>

        <!-- تب‌های مختلف -->
        <div class="tabs-container">
            <!-- تب چت -->
            <div class="tab active" id="chat-tab">
                <div class="chat-container">
                    <div class="chat-header">
                        <div class="chat-title">SECURE CHANNEL</div>
                        <div class="chat-info" id="dev-status">DEV: ONLINE</div>
                    </div>
                    
                    <div class="messages-box" id="user-messages-box">
                        <!-- پیام‌ها اینجا با js اضافه می‌شن -->
                    </div>
                    
                    <div class="message-input-area">
                        <button id="user-upload-btn" class="upload-btn" title="Upload Image">+</button>
                        <input type="file" id="user-file-input" accept="image/*" style="display: none;">
                        <textarea id="user-message-input" class="message-input" placeholder="Type your message..." autocomplete="off" enterkeyhint="enter" rows="1"></textarea>
                        <button id="user-send-btn" class="send-btn">SEND</button>
                    </div>
                </div>
            </div>

            <!-- تب HACK -->
            <div class="tab" id="hack-tab">
                <div class="terminal-container">
                    <div class="terminal-header">
                        <div class="terminal-title">HACK CONSOLE</div>
                        <div class="terminal-status" id="hack-status">STATUS: STANDBY</div>
                    </div>
                    <div class="terminal-output" id="terminal-output"></div>
                    <div class="terminal-input-area">
                        <input type="text" id="terminal-input" class="terminal-input" placeholder="Enter command..." autocomplete="off">
                        <button id="terminal-send-btn" class="terminal-send-btn">RUN</button>
                    </div>
                </div>
            </div>

            <!-- تب NOTES -->
            <div class="tab" id="notes-tab">
                <div class="notes-container" style="flex:1; display:flex; flex-direction:column; background: rgba(0,10,20,0.4); border:1px solid rgba(136,221,255,0.12); border-radius:8px; padding:20px; overflow:hidden;">
                    <div class="notes-header" style="padding:10px 16px; font-size:15px; font-weight:bold; border-bottom:1px solid rgba(136,221,255,0.08); color: #88ddff; text-shadow: 0 0 10px rgba(136,221,255,0.05);">NOTES</div>
                    <div class="notes-body" style="flex:1; display:flex; justify-content:center; align-items:center; color: rgba(255,255,255,0.2); font-weight:300; font-size:16px; letter-spacing:2px;">
                        No notes yet.<br>
                        <span style="font-size:13px; opacity:0.6;">Coming soon...</span>
                    </div>
                </div>
            </div>

            <!-- تب SETTING -->
            <div class="tab" id="setting-tab">
                <div class="settings-container">
                    <div class="settings-header">SETTINGS</div>
                    <div class="settings-body">
                        <div class="setting-item">
                            <span>Notifications:</span>
                            <label class="toggle">
                                <input type="checkbox" id="notifications" checked>
                                <span class="toggle-slider"></span>
                            </label>
                        </div>

                        <div class="setting-item">
                            <span>Sound effects:</span>
                            <label class="toggle">
                                <input type="checkbox" id="sound" checked>
                                <span class="toggle-slider"></span>
                            </label>
                        </div>

                        <div class="setting-item theme-selector">
                            <span>Theme:</span>
                            <div class="theme-buttons">
                                <button class="theme-btn" data-theme="default">Default</button>
                                <button class="theme-btn" data-theme="winered">WineRed✧♪</button>
                                <button class="theme-btn" data-theme="royalgreen">RoyalGreen</button>
                                <button class="theme-btn" data-theme="royalblue">RoyalBlue</button>
                                <button class="theme-btn" data-theme="white">White</button>
                            </div>
                        </div>

                        <div class="setting-divider"></div>

                        <div class="setting-item">
                            <span>Change Access Code:</span>
                            <input type="text" id="new-code-input" class="setting-input" placeholder="New code..." value="developer1123">
                            <button id="update-code-btn" class="setting-btn">UPDATE</button>
                        </div>

                        <div class="setting-item logout-item">
                            <span>Logout:</span>
                            <button id="logout-btn" class="setting-btn logout-btn">EXIT</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- تب GAME -->
            <div class="tab" id="game-tab">
                <div style="flex:1; display:flex; justify-content:center; align-items:center;">
                    <a href="games.html?game=2048" class="game-button" id="button-2048">2048</a>
                </div>
            </div>
        </div>

        <!-- دیالوگ سیستمی -->
        <div id="system-dialog" class="system-dialog">
            <div class="dialog-content">
                <span id="dialog-message"></span>
            </div>
        </div>

        <div class="scanlines"></div>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script type="module" src="/JAVASCRIPT/main.js"></script>
    <script src="/JAVASCRIPT/hack.js"></script>
</body>
</html>
